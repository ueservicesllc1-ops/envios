<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1a2236" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#78350f" stroke-width="3" stroke-dasharray="6 6" />
  <!-- Letter F in serif -->
  <text x="256" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="middle">F</text>
  <!-- Falconi Text -->
  <text x="256" y="375" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="8" fill="#f8fafc" text-anchor="middle">FALCONI</text>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#f59e0b" text-anchor="middle">ASESOR PRO</text>
</svg>
